<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="favtitle">
  <title id="favtitle">Episteme Geospatial</title>
  <!-- The Episteme Geospatial mark, transparent and theme-adaptive, drawn twice.

       The .ink layer is the mark: brand green on a light scheme, white on a
       dark one. The .halo layer underneath is the same geometry stroked wider
       in the OPPOSITE ink. In a browser tab the halo matches the tab and
       disappears, so the tab sees only the ink. Anywhere the icon is
       rasterised once and composited onto a surface nobody chose (Google
       results render it dark, then put it on a white disc) the halo is what
       keeps it visible: white ink on a white disc is invisible, white ink
       inside a green halo is a green mark. Measured 2026-11-06: the plain
       adaptive version of this file rendered rgb(255,255,255) under a dark
       scheme and reached Google as a blank circle.

       Same file on epistemegeospatial.com, crashmap and cadastral-analytics;
       the raster fallbacks beside it are rendered from this file's dark
       scheme onto transparency, so they carry the halo too. Keep this comment
       free of a double hyphen: it is illegal inside an XML comment, and a
       browser that hits one draws a partial file. -->
  <style>
    svg { --ink: #274b3a; --halo: #ffffff; }
    @media (prefers-color-scheme: dark) { svg { --ink: #ffffff; --halo: #274b3a; } }
    .halo * { stroke: var(--halo); fill: none; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
    .halo path { fill: var(--halo); stroke-width: 12; }
    .ink line { stroke: var(--ink); stroke-width: 2; fill: none; }
    .ink path { fill: var(--ink); stroke: none; }
  </style>
